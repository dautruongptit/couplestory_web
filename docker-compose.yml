version: '3.9'
services:
  couplestory-web:
    build:
      context: .
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    image: couplestory-web:latest
    container_name: couplestory-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:8100"
    networks:
      - couplestory-net

networks:
  # Created once on the server: docker network create couplestory-net
  # Shared with the API compose project so nginx can reach couplestory-api by name.
  couplestory-net:
    external: true
